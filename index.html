<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MakePDFRight - Fast, Private Online PDF &amp; AI Tools</title>
    
    <!-- SEO & Metadata -->
    <meta name="description" content="MakePDFRight is a fast, free, and secure online PDF toolkit. Merge, split, compress, edit, convert PDFs to Word/Excel/JPG, generate AI images, and transcribe audio with automatic file deletion." />
    <meta name="keywords" content="PDF tools, merge PDF, split PDF, compress PDF, PDF to Word, PDF to Excel, edit PDF, AI image generator, audio transcribe, free PDF editor" />
    <meta name="author" content="MakePDFRight" />
    <meta name="theme-color" content="#E5322D" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect & Asynchronous Fonts for optimal PageSpeed performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph Social Preview Card -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MakePDFRight" />
    <meta property="og:title" content="MakePDFRight - Fast, Private Online PDF &amp; AI Tools" />
    <meta property="og:description" content="Merge, split, compress, convert, edit, and AI-enhance your PDFs securely in your browser. All files auto-deleted shortly after processing." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MakePDFRight - Fast, Private Online PDF &amp; AI Tools" />
    <meta name="twitter:description" content="Merge, split, compress, convert, edit, and AI-enhance your PDFs securely in your browser. All files auto-deleted shortly after processing." />
    <meta name="twitter:image" content="/og-image.png" />

    <script>
      (function() {
        try {
          const saved = localStorage.getItem('theme');
          const theme = saved || 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
